<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style id="base">
  body { font-family: sans-serif; margin: 16px; line-height: 1.55; color: #212121; background: #ffffff; word-wrap: break-word; }
  :root[data-dark="true"] body { color: #e0e0e0; background: #1e1e1e; }
  :root[data-dark="true"] a { color: #8ab4f8; }
  pre { overflow: auto; padding: 10px; border-radius: 6px; background: rgba(127,127,127,.15); }
  code { font-family: monospace; background: rgba(127,127,127,.15); padding: 1px 4px; border-radius: 3px; }
  pre code { background: none; padding: 0; }
  blockquote { margin: 8px 0; padding: 4px 12px; border-left: 4px solid rgba(127,127,127,.5); opacity: .85; }
  table { border-collapse: collapse; }
  td, th { border: 1px solid rgba(127,127,127,.6); padding: 4px 8px; }
  img { max-width: 100%; }
  .adm { padding: 8px 12px; margin: 8px 0; border-left: 4px solid #1e88e5; background: rgba(30,136,229,.12); }
  .block { border: 1px solid rgba(127,127,127,.5); padding: 4px 12px; margin: 8px 0; }
</style>
<style id="user"></style>
</head>
<body>
<div id="out"></div>
<script src="render.js"></script>
</body>
</html>
