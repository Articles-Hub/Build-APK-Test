plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.textedit'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.textedit"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        resources {
            excludes += ['META-INF/versions/**', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/INDEX.LIST']
        }
    }
}

dependencies {
    // FTP / FTPS
    implementation 'commons-net:commons-net:3.9.0'
    // SFTP (bản fork có bảo trì của JSch)
    implementation 'com.github.mwiede:jsch:0.2.19'
}
